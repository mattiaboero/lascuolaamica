name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  smoke:
    # PR + push: solo mode perfect (smoke veloce)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      # I browser di Playwright in cache, con la chiave legata alla versione
      # del package-lock: senza cache "playwright install --with-deps" passa
      # da apt e il 23/10/2026 ci ha messo 10 e 20 minuti (job annullato).
      # Con la cache i pacchetti di sistema non si reinstallano: Chromium usa
      # quelli gia' presenti nell'immagine di ubuntu-latest.
      - name: Versione di Playwright
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache dei browser di Playwright
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Browser e pacchetti di sistema (cache assente)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 &
          sleep 2
      - name: Markup statico di classi e ambiti uguale a quello del motore
        run: npm run check:static-grids

      - name: E2E smoke (perfect, 8 subjects)
        run: npm run test:e2e:perfect

      - name: E2E ripasso (mixed + sessione di ripasso)
        run: npm run test:e2e:ripassa
        env:
          E2E_SUBJECTS: matematica inglese

      - name: E2E uscita dal gioco (timer di avanzamento annullato)
        run: npm run test:e2e:interrupt
        env:
          E2E_SUBJECTS: matematica inglese

      - name: E2E dialoghi (focus di ritorno e coda)
        run: npm run test:e2e:dialogs
        env:
          E2E_SUBJECTS: matematica inglese

      - name: E2E sottoaree (nessun bottone senza domande nel pool)
        run: npm run test:e2e:subareas

      - name: E2E tabelline (pagina info, con e senza JS)
        run: npm run test:e2e:tabelline

      - name: E2E sintesi vocale (solo voci installate sul dispositivo)
        run: npm run test:e2e:voci

      - name: E2E timer di gioco (facoltativo, orologio simulato)
        run: npm run test:e2e:timer

      - name: E2E quiz su smartphone (risposte e Avanti nella finestra)
        run: npm run test:e2e:viewport

      - name: E2E home (materie in cima, nav, nessuna comparsa)
        run: npm run test:e2e:home

      - name: E2E CLS pagine materia (rete e CPU lente)
        run: npm run test:e2e:cls

      # Dettaglio degli spostamenti (pagina, valore, sorgenti, istante) anche
      # quando il test fallisce: serve a capire un CLS intermittente.
      - name: Report del CLS
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cls-report
          path: test-results/cls/
          if-no-files-found: ignore
          retention-days: 14

      - name: E2E aggiornamento silenzioso (niente modale, niente ricarica in partita)
        run: npm run test:e2e:sw

      - name: E2E focus alla chiusura dei modali con Esc
        run: npm run test:e2e:focus

      - name: E2E domande per classe (rete lenta, cambio classe, offline)
        run: npm run test:e2e:json-classi

      - name: E2E CSS critico delle pagine materia (uguale ai fogli completi)
        run: npm run test:e2e:css-critico

      - name: E2E classe 1ª (matematica, domande e bonus solo di 1ª)
        run: npm run test:e2e:classe1

  full:
    # Daily schedule: perfect + mixed + worst
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start local server
        run: |
          python3 -m http.server 4173 &
          sleep 2
      - name: E2E full (perfect + mixed + worst, 8 subjects)
        run: npm run test:e2e:full

      - name: E2E classe 1ª (matematica, domande e bonus solo di 1ª)
        run: npm run test:e2e:classe1
