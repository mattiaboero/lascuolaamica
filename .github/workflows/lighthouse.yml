name: Lighthouse

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LHCI_GITHUB_TOKEN scrive gli status con questo token: serve statuses: write.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sulle PR il checkout e' il merge commit: lo status va sul commit della PR.
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
