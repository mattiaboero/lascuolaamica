name: Lighthouse

on:
  schedule:
    - cron: '0 6 * * *'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # LHCI_GITHUB_TOKEN scrive gli status con questo token: serve statuses: write.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Run Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Senza PR vale github.sha: lo status va sul commit di main misurato.
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
