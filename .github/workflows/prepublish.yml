name: Prepublish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  prepublish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run prepublish-check
        run: bash prepublish-check.sh

      - name: Audit questions JSON
        run: node scripts/audit_questions_json.js
