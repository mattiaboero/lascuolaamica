name: Prepublish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Niente permessi di default: ogni job dichiara i suoi.
permissions: {}

jobs:
  prepublish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      # Dipendenze di produzione: oggi nessuna. Se ne entra una con una falla
      # alta o critica, la PR non passa. Le devDependencies hanno un rischio
      # accettato e documentato in .github/SECURITY.md.
      - name: Vulnerabilita' nelle dipendenze di produzione
        run: npm audit --omit=dev --audit-level=high

      # Gli stessi controlli di `npm run verify` in locale. Fino alla 4.27.26 la
      # CI ne faceva solo una parte (lint, prepublish-check, IndexNow, audit):
      # revisione delle domande, leggibilita', conteggi, CSS critico, pagine
      # delle tabelline, titoli ed export non bloccavano il merge.
      # check:static-grids vuole Chromium: gira nel job smoke.
      - name: Controlli di dati, testi e codice (verify:dati)
        run: npm run verify:dati

      - name: Run prepublish-check
        run: bash prepublish-check.sh

      - name: Export per Cloudflare e canale
        run: npm run export && npm run check:export-canale
