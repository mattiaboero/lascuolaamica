name: Prepublish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  prepublish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint + stylelint)
        run: npm run lint

      - name: Run prepublish-check
        run: bash prepublish-check.sh

      - name: Audit questions JSON
        run: node scripts/audit_questions_json.js
