<!-- Stessi fogli del resto del sito: token Wada Sanzo + font self-hosted.
     Percorsi relativi: la pagina funziona anche aperta da disco. -->
<link rel="stylesheet" href="../tokens.css">

<style>
body {
  font-family: 'Nunito', 'Nunito Fallback', sans-serif;
  min-height: 100vh;
  margin: 0;
  padding: 32px 16px 40px;
  /* stesso cielo della home (index.css) */
  background: linear-gradient(170deg, #74b9ff 0%, #a29bfe 40%, #a8e6cf 75%, #55efc4 100%);
  background-attachment: fixed;
  color: var(--ws-slate-black, #2c2a28);
  font-size: 17px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

.card {
  max-width: 480px;
  margin: 0 auto;
  padding: 28px 20px 24px;
  text-align: center;
  background: var(--ws-ivory, #fffdf7);
  border: 1px solid var(--ws-cinnamon-border, #e7d8be);
  border-radius: var(--radius-lg, 28px);
  box-shadow: var(--shadow-card, 0 14px 34px rgba(44 42 40 / 0.16));
}

.mascotte {
  width: 120px;
  height: auto;
  aspect-ratio: 600 / 848;
  display: block;
  margin: 0 auto 18px;
}

h1 {
  font-family: 'Fredoka One', 'Fredoka One Fallback', cursive;
  font-weight: 400;
  font-size: 2rem;
  line-height: 1.15;
  margin: 0 0 8px;
  color: var(--subj-math-a, #6e57a6);
}

.sottotitolo {
  margin: 0 0 24px;
  font-size: 1.0625rem;
  color: var(--ws-hays-russet, #6e6357);
}

nav ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

nav li + li { margin-top: 12px; }

nav a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 56px;
  padding: 14px 18px;
  border-radius: var(--radius-md, 18px);
  color: #ffffff;
  font-weight: 800;
  font-size: 1.0625rem;
  text-decoration: none;
}

nav a:hover,
nav a:active { text-decoration: underline; }

/* stesso indicatore di focus del resto del sito (index.css) */
:focus-visible {
  outline: 3px solid #0050ef;
  outline-offset: 3px;
  border-radius: 4px;
  box-shadow: 0 0 0 5px rgba(0, 80, 239, .2);
}
/* fallback per browser senza :focus-visible: mai outline:none */
nav a:focus { outline: 3px solid #0050ef; outline-offset: 3px; }
nav a:focus:not(:focus-visible) { outline: none; }

.b1 { background: var(--subj-math-a, #6e57a6); }
.b2 { background: var(--subj-tabelline-a, #96631a); }
.b3 { background: var(--subj-bosco-a, #55742f); }
.b4 { background: var(--subj-breakout-a, #993377); }
.b5 { background: var(--subj-eng-a, #2e6fa6); }

footer {
  margin-top: 22px;
  font-size: 0.875rem;
  color: var(--ws-hays-russet, #6e6357);
}

@media (prefers-reduced-motion: no-preference) {
  nav a { transition: transform .12s ease; }
  nav a:hover { transform: translateY(-1px); }
}
</style>
</head>

<main class="card">

  <picture>

         width="120" height="170"

  <h1>La scuola amica</h1>
  <p class="sottotitolo">Quiz ed esercizi gratuiti per la scuola primaria</p>

  <nav aria-label="Link de La scuola amica">

      <li><a class="b3" href="https://www.youtube.com/playlist?list=PLXvXyM39JWFw">Le canzoni di storia e geografia</a></li>
      <li><a class="b4" href="https://www.youtube.com/@lascuolaamica">Il canale YouTube</a></li>
      <li><a class="b5" href="mailto:ciao@lascuolaamica.it">Scrivici</a></li>
    </ul>
  </nav>

  <footer>
    <p>Progetto gratuito e senza pubblicità.</p>
  </footer>

</main>

<!--
SISTEMA VISIVO: token e font del sito (tokens.css + fonts.css), niente palette
propria. Titolo in Fredoka One, testo in Nunito, entrambi self-hosted da
assets/fonts/ (nessuna chiamata a Google Fonts). Fondo: stesso gradiente cielo
della home. Colori bottoni: hue materia Wada Sanzo di tokens.css, gia' calibrate
per >=4.5:1 su bianco.

CONTRASTI CALCOLATI (WCAG 2.1, soglia 4.5:1 testo normale)
  #2c2a28 slate-black su #fffdf7 ivory (testo, footer) ....... 14.05:1  OK
  #6e57a6 math-a su #fffdf7 (titolo H1) ...................... 5.77:1   OK
  bianco #FFFFFF su #6e57a6 math-a (b1, esercizi) ............ 5.87:1   OK
  bianco #FFFFFF su #96631a tabelline-a (b2, tabelline) ...... 5.13:1   OK
  bianco #FFFFFF su #55742f bosco-a (b3, canzoni) ............ 5.35:1   OK
  bianco #FFFFFF su #993377 breakout-a (b4, YouTube) ......... 6.79:1   OK
  bianco #FFFFFF su #2e6fa6 eng-a (b5, Scrivici) ............. 5.33:1   OK
  outline focus #0050ef su #fffdf7 ivory ..................... 6.08:1   OK
  #6e6357 hays-russet su #fffdf7 (sottotitolo) ............... 5.76:1   OK

Altre hue di tokens.css utilizzabili per bottoni futuri (bianco sopra):
  #1f7a5e civ-a 5.25:1 | #c24a5b ita-a 4.75:1 | #9a6a43 sto-a 4.65:1
  #bc5925 prob-a 4.57:1 | #3a8454 geo-a 4.56:1 | #29837d sci-a 4.53:1
NON usare le hue di index.css (--math-a #9B5DE5 4.13:1, --geo-a #2d8f5a 4.05:1,
--sci-a #2a9d8f 3.32:1 ...): sono pensate per gradienti, non per testo bianco.
-->
